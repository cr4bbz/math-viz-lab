schema_version: 1

experiment:
  id: "002-prime-height-geometry"
  title: "Primhöhen als diagonale Fasern"
  status: "active"

object:
  family: "h(a,b) = a+b on the positive integer lattice"
  parameter_space: "height index n ∈ ℕ, n ≥ 2"
  state_space: "lattice coordinates (a,b) ∈ ℕ₊²"
  solution_locus: "H_n = {(a,b) ∈ ℕ₊² | a+b=n}"

paths:
  renderer: "experiments/002-prime-height-geometry/render.py"
  lean_source: "MathVizLab/PrimeHeightGeometry.lean"
  notes: "experiments/002-prime-height-geometry/ResearchNotes.md"
  states_dir: "experiments/002-prime-height-geometry/states"
  renders_dir: "experiments/002-prime-height-geometry/renders"

view:
  projection_sequence:
    - "positive lattice (a,b) with height field h=a+b"
    - "height projection πₕ : (a,b) ↦ n=a+b"
    - "prime filter n ↦ 1_Prime(n)"
    - "consecutive prime heights (p,q) ↦ bandGap=q-p"
    - "finite-window observation H_n ∩ [1,N]²"
  default_state: "prime-bands-window-16"

research:
  question: "Wie werden Primzahlverteilung und Primzahllücken zu einer Geometrie diagonaler Fasern, und welche Muster entstehen nur durch das endliche Beobachtungsfenster?"
  observations:
    - id: "obs-prime-bands-16"
      statement: "Im 16×16-Fenster erscheinen Primhöhen als ausgewählte parallele Diagonalbänder."
      evidence: "numerical_evidence"
      state: "prime-bands-window-16"
    - id: "obs-window-truncation"
      statement: "Die sichtbare Fasergröße sinkt nach n=N+1, obwohl die volle positive Faser weiter wächst."
      evidence: "visual_observation"
      state: "truncated-fiber-19"
  conjectures: []
  proved_claims:
    - id: "claim-complete-cardinality"
      statement: "Eine im N×N-Fenster vollständige positive Höhenfaser enthält n−1 Punkte."
      evidence: "lean_proved"
      theorem: "MathVizLab.visibleHeightCardinality_of_complete"
    - id: "claim-truncated-cardinality"
      statement: "Für N+1<n≤2N besitzt die sichtbare Faser genau 2N−n+1 Punkte."
      evidence: "lean_proved"
      theorem: "MathVizLab.visibleHeightCardinality_of_truncated"
    - id: "claim-gap-11-13"
      statement: "Die Primhöhen 11 und 13 haben Indexlücke 2, ein Zwischenband und euklidischen Abstand √2."
      evidence: "lean_proved"
      theorem: "MathVizLab.eleven_thirteen_prime_gap / bandNormalDistance_eleven_thirteen"

render:
  format: "svg"
  browser_based: false
  deterministic: true
  axes_required: true
  legends_required: true
  equal_comparison_panels: true

validation:
  commands:
    - "python .agents/skills/graphical-math-research/scripts/validate_experiment.py experiments/002-prime-height-geometry/experiment.yaml"
    - "python experiments/002-prime-height-geometry/render.py --check-layout"
    - "python -m unittest discover -s experiments/002-prime-height-geometry/tests -v"
    - "lake build"
