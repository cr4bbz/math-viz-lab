schema_version: 1

experiment:
  id: "001-cubic-fibers"
  title: "Kubische Fasern und ein Bifurkationswert"
  status: "active"

object:
  family: "F(a,x) = x^3 - a*x"
  parameter_space: "a ∈ ℝ"
  state_space: "x ∈ ℝ"
  solution_locus: "V = {(a,x) ∈ ℝ² | F(a,x)=0}"

paths:
  renderer: "experiments/001-cubic-fibers/render.py"
  lean_source: "MathVizLab/CubicFamily.lean"
  notes: "experiments/001-cubic-fibers/ResearchNotes.md"
  states_dir: "experiments/001-cubic-fibers/states"
  renders_dir: "experiments/001-cubic-fibers/renders"

view:
  projection_sequence:
    - "term field F : ℝ² → ℝ"
    - "zero-level set V = F⁻¹({0})"
    - "parameter projection πₐ : V → ℝ"
    - "state projection πₓ : V → ℝ"
  default_state: "positive-parameter"

research:
  question: "Wie verändern sich die Fasern der beiden Koordinatenprojektionen an ihren außergewöhnlichen Werten?"
  observations:
    - id: "obs-fiber-count"
      statement: "Die dargestellte Parameterfaser hat für a=1 drei verschiedene Punkte."
      evidence: "visual_observation"
      state: "positive-parameter"
    - id: "obs-exceptional-state"
      statement: "Die dargestellte Zustandsfaser über x=0 umfasst die ganze Parameterachse."
      evidence: "visual_observation"
      state: "exceptional-state-fiber"
  conjectures: []
  proved_claims:
    - id: "claim-zero-locus"
      statement: "F(a,x)=0 genau dann, wenn x=0 oder x²=a."
      evidence: "lean_proved"
      theorem: "MathVizLab.cubicFamily_eq_zero_iff"
    - id: "claim-parameter-fibers"
      statement: "Die Parameterfasern sind für a<0, a=0 und a>0 vollständig klassifiziert."
      evidence: "lean_proved"
      theorem: "MathVizLab.parameterFiber_of_neg / parameterFiber_at_zero / parameterFiber_of_pos"
    - id: "claim-state-fibers"
      statement: "Über x=0 liegt die ganze Parameterachse; für x≠0 genau a=x²."
      evidence: "lean_proved"
      theorem: "MathVizLab.stateFiber_at_zero / stateFiber_of_ne_zero"

render:
  format: "svg"
  browser_based: false
  deterministic: true
  axes_required: true
  legends_required: true
  equal_comparison_panels: true

validation:
  commands:
    - "python .agents/skills/graphical-math-research/scripts/validate_experiment.py experiments/001-cubic-fibers/experiment.yaml"
    - "python experiments/001-cubic-fibers/render.py --check-layout"
    - "python -m unittest discover -s experiments/001-cubic-fibers/tests -v"
    - "lake build"
